name = "db-mind-ultra"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database binding ────────────────────────────────────────────────────
# After running `wrangler d1 create db-mind-ultra`, paste the database_id here.
[[d1_databases]]
binding = "DB"
database_name = "db-mind-ultra"
database_id = "26a66573-c306-4f46-8693-e3524026fe3a"

# ─── Routes ─────────────────────────────────────────────────────────────────
# All API traffic goes to this Worker.
# Your frontend (Cloudflare Pages) proxies /api/* to this Worker automatically.
[vars]
ENVIRONMENT = "production"
